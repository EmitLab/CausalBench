type: model
name: linear_regression
source: scikit-learn
url: https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LinearRegression.html
description: "Ordinary least squares Linear Regression. Fits a linear model with coefficients to minimize the residual sum of squares between the observed targets and the predictions."
task:
    id: 1
    version: 1
path: linear_regression.py
hyperparameters:
    fit_intercept:
        data: boolean
        description: Whether to calculate the intercept for this model. If set to False, no intercept will be used in calculations (i.e. data is expected to be centered).
        value: True
    positive:
        data: boolean
        description: When set to True, forces the coefficients to be positive. This option is only supported for dense arrays.
        value: False
