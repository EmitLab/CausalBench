type: model
name: decision_tree_classifier
source: scikit-learn
url: https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeClassifier.html
description: "Decision Tree Classifier. A non-parametric supervised learning method used for classification."
task:
    id: 5
    version: 1
path: decision_tree_classifier.py
hyperparameters:
    criterion:
        data: string
        description: Function to measure the quality of a split.
        value: gini
    splitter:
        data: string
        description: Strategy used to choose the split at each node.
        value: best
    max_depth:
        data: integer
        description: Maximum depth of the tree.
        value: null
    min_samples_split:
        data: integer
        description: Minimum number of samples required to split an internal node.
        value: 2
    min_samples_leaf:
        data: integer
        description: Minimum number of samples required to be at a leaf node.
        value: 1
    min_weight_fraction_leaf:
        data: decimal
        description: Minimum weighted fraction of the sum total of weights required to be at a leaf node.
        value: 0.0
    max_features:
        data: string
        description: Number of features to consider when looking for the best split.
        value: null
    random_state:
        data: integer
        description: Seed used by the random number generator.
        value: null
    max_leaf_nodes:
        data: integer
        description: Grow a tree with max_leaf_nodes in best-first fashion.
        value: null
    min_impurity_decrease:
        data: decimal
        description: A node will be split if this split induces a decrease of the impurity greater than or equal to this value.
        value: 0.0
    class_weight:
        data: string
        description: Weights associated with classes.
        value: null
    ccp_alpha:
        data: decimal
        description: Complexity parameter used for Minimal Cost-Complexity Pruning.
        value: 0.0
