# California Housing dataset: https://scikit-learn.org/stable/datasets/real_world.html#california-housing-dataset
causalbench:
    major: '0'
    minor: '2'
    build: '0'
type: dataset
name: california_housing
source: sklearn
url: https://scikit-learn.org/stable/datasets/real_world.html#california-housing-dataset
description: Predict median house values in California districts based on census data (regression task)
files:
    file1:
        type: csv
        data: dataframe
        path: california_housing_data.csv
        headers: true
        index:
            target: MedHouseVal
        columns:
            MedInc:
                index: 0
                header: MedInc
                type:
                data: decimal
            HouseAge:
                index: 1
                header: HouseAge
                type:
                data: decimal
            AveRooms:
                index: 2
                header: AveRooms
                type:
                data: decimal
            AveBedrms:
                index: 3
                header: AveBedrms
                type:
                data: decimal
            Population:
                index: 4
                header: Population
                type:
                data: decimal
            AveOccup:
                index: 5
                header: AveOccup
                type:
                data: decimal
            Latitude:
                index: 6
                header: Latitude
                type:
                data: decimal
            Longitude:
                index: 7
                header: Longitude
                type:
                data: decimal
            MedHouseVal:
                index: 8
                header: MedHouseVal
                type:
                data: decimal
